name: macOS beta
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/macos-beta.yml', 'desktop/src-tauri/tauri.macos.conf.json', 'scripts/prepare-desktop.sh']
    tags: ['v*-beta.*']
permissions:
  contents: read
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: aarch64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: prototype/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Frontend dependencies
        run: npm ci --prefix prototype
      - name: Build helper
        run: sh scripts/build-sandbox.sh
      - name: Test and package backend
        run: |
          set -eu
          # macOS /var aliases /private/var. Use the physical CI temp path so
          # strict workspace link checks still reject links inside projects.
          TEST_TMP="$(cd "$RUNNER_TEMP" && pwd -P)/dongran-tests"
          mkdir -p "$TEST_TMP"
          mvn -B "-Djava.io.tmpdir=$TEST_TMP" -pl backend test package
      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-test-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
      - name: Bundle Java and helper
        run: sh scripts/prepare-desktop.sh --skip-backend-build
      - name: Build macOS bundles
        working-directory: desktop
        run: npx --yes --package @tauri-apps/cli@2.8.4 tauri build --config src-tauri/tauri.macos.conf.json --bundles app,dmg
      - name: Smoke test installed application
        run: |
          set -eu
          APP="$(find desktop/src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP"
          "$APP/Contents/Resources/resources/runtime/bin/java" -version
          "$APP/Contents/Resources/resources/sandbox/dongran-sandbox" probe
          open "$APP"
          python3 scripts/check-desktop-startup.py
      - name: Checksums
        run: |
          cd desktop/src-tauri/target/release/bundle/dmg
          shasum -a 256 *.dmg > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-beta
          path: desktop/src-tauri/target/release/bundle/dmg/*
          if-no-files-found: error
