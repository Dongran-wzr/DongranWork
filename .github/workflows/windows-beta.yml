name: Windows beta
on:
  push:
    tags: ['v*-beta.*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: prototype/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Frontend dependencies
        run: npm ci --prefix prototype
      - name: Build sandbox for integration tests
        run: ./scripts/build-sandbox.ps1
      - name: Test and package backend
        run: mvn -B -pl backend test package
      - name: Bundle Java and sandbox
        run: ./scripts/prepare-desktop.ps1 -SkipBackendBuild
      - name: Build Windows installer
        working-directory: desktop
        run: npx --yes --package @tauri-apps/cli@2.8.4 tauri build --bundles nsis
      - name: Checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*.exe
          if (-not $files) { throw 'Installer missing' }
          $files | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content -Encoding ascii desktop/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-beta
          path: desktop/src-tauri/target/release/bundle/nsis/*
          if-no-files-found: error
      - name: Publish beta
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          draft: false
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
