name: Publish macOS beta assets
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful macOS beta build run ID
        required: true
        default: '37423008754'
      release_tag:
        description: Existing beta release tag
        required: true
        default: 'v0.2.0-beta.2'
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-aarch64-beta
          path: artifacts/arm64
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: macos-x86_64-beta
          path: artifacts/x64
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Verify and publish existing build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+', tag):
              raise SystemExit('Expected beta release tag')
          release = json.loads(subprocess.check_output(['gh', 'release', 'view', tag, '--json', 'body,isPrerelease']))
          if not release['isPrerelease']:
              raise SystemExit('Target must be an existing prerelease')
          output = pathlib.Path('publish')
          output.mkdir()
          for arch in ('arm64', 'x64'):
              root = pathlib.Path('artifacts') / arch
              for line in (root / 'SHA256SUMS.txt').read_text().splitlines():
                  digest, name = line.split(None, 1)
                  file = root / name.strip().lstrip('*')
                  if file.parent != root or hashlib.sha256(file.read_bytes()).hexdigest() != digest:
                      raise SystemExit('Artifact checksum mismatch')
              files = list(root.glob('*.dmg'))
              if len(files) != 1 or tag[1:] not in files[0].name:
                  raise SystemExit('Expected exactly one DMG matching release version')
              target = output / f'Dongran-Work_{tag[1:]}_macos-{arch}.dmg'
              target.write_bytes(files[0].read_bytes())
              checksum = output / f'SHA256SUMS-macos-{arch}.txt'
              checksum.write_text(f'{hashlib.sha256(target.read_bytes()).hexdigest()}  {target.name}\n')
          subprocess.run(['gh', 'release', 'upload', tag, *map(str, output.iterdir()), '--clobber'], check=True)
          marker = '## macOS beta'
          body = release['body']
          if marker not in body:
              body += '\n\n' + marker + '\n\n- arm64：Apple Silicon；x64：Intel。最低 macOS 12。\n- 已通过两个架构的构建、后端测试及打包应用启动检查，尚未做完整人工功能验收。\n- 未签名、未公证；macOS 沙箱执行暂不支持，功能尚未与 Windows 完全一致。\n- Mac 安装包来自修复后 main 的构建，构建记录：https://github.com/' + os.environ['GH_REPO'] + '/actions/runs/' + '${{ inputs.run_id }}' + '\n'
          pathlib.Path('release-notes.md').write_text(body)
          subprocess.run(['gh', 'release', 'edit', tag, '--notes-file', 'release-notes.md', '--title', f'Dongran Work {tag[1:]} · Windows / macOS'], check=True)
          PY
