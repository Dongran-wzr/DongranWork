server:
  address: 127.0.0.1
  port: ${DONGRAN_PORT:3210}
  shutdown: graceful
  error:
    include-message: never
spring:
  application:
    name: dongran-work
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 10s
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  mvc:
    async:
      request-timeout: 1800000
  main:
    banner-mode: off
logging:
  level:
    root: WARN
    com.dongran: INFO
dongran:
  data-dir: ${DONGRAN_DATA_DIR:${user.home}/.dongran-work}
  token: ${DONGRAN_TOKEN:}
